<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How raw geographic data becomes a camera-ready map: world-atlas shapes, TopoJSON unpacking, d3-geo projection">
  <defs>
    <radialGradient id="paper" cx="50%" cy="38%" r="85%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#E2D1AC"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#46341c" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#46341C" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16110D"/>
    </marker>
  </defs>

  <rect width="1200" height="470" fill="url(#paper)"/>

  <text x="48" y="58" font-family="Archivo, Arial, sans-serif" font-size="26" font-weight="900" fill="#16110D" letter-spacing="-0.4">FROM RAW COORDINATES TO A CAMERA-READY MAP</text>
  <rect x="984" y="32" width="168" height="32" rx="16" fill="#16110D"/>
  <text x="1068" y="53" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#FFEECC">ZERO DRAWING</text>

  <!-- card 1: world-atlas -->
  <g filter="url(#softShadow)">
    <rect x="48" y="100" width="330" height="250" rx="16" fill="#FFFCF4" stroke="#16110D" stroke-width="2.5"/>
  </g>
  <text x="72" y="152" font-family="Archivo, Arial, sans-serif" font-size="40" font-weight="900" fill="#FFBE2E" stroke="#16110D" stroke-width="1.2">01</text>
  <text x="132" y="150" font-family="Archivo, Arial, sans-serif" font-size="21" font-weight="900" fill="#16110D">world-atlas</text>
  <text x="72" y="184" font-family="Archivo, Arial, sans-serif" font-size="14.5" fill="#4a4231">Every country's outline as raw</text>
  <text x="72" y="204" font-family="Archivo, Arial, sans-serif" font-size="14.5" fill="#4a4231">longitude / latitude points.</text>
  <path d="M 92 250 l 26 -16 22 8 18 -10 24 14 -6 22 -28 10 -30 -4 z" fill="#FFBE2E" fill-opacity="0.5" stroke="#16110D" stroke-width="2"/>
  <path d="M 214 238 l 30 -12 26 10 8 20 -18 18 -34 2 -14 -20 z" fill="#FFEECC" stroke="#16110D" stroke-width="2"/>
  <path d="M 150 296 l 34 -8 20 12 -8 18 -38 4 -12 -14 z" fill="#FFEECC" stroke="#16110D" stroke-width="2"/>
  <rect x="72" y="316" width="130" height="24" rx="12" fill="#16110D"/>
  <text x="137" y="332" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#FFEECC">THE SHAPES</text>

  <!-- arrow 1 -->
  <line x1="392" y1="225" x2="428" y2="225" stroke="#16110D" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- card 2: TopoJSON -->
  <g filter="url(#softShadow)">
    <rect x="440" y="100" width="330" height="250" rx="16" fill="#FFFCF4" stroke="#16110D" stroke-width="2.5"/>
  </g>
  <text x="464" y="152" font-family="Archivo, Arial, sans-serif" font-size="40" font-weight="900" fill="#FFBE2E" stroke="#16110D" stroke-width="1.2">02</text>
  <text x="524" y="150" font-family="Archivo, Arial, sans-serif" font-size="21" font-weight="900" fill="#16110D">TopoJSON</text>
  <text x="464" y="184" font-family="Archivo, Arial, sans-serif" font-size="14.5" fill="#4a4231">Shared borders stored once —</text>
  <text x="464" y="204" font-family="Archivo, Arial, sans-serif" font-size="14.5" fill="#4a4231">a tiny file, unpacked in one line.</text>
  <rect x="464" y="228" width="122" height="86" rx="10" fill="#16110D"/>
  <text x="525" y="262" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#FFEECC">countries.json</text>
  <text x="525" y="284" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFBE2E">0.7 MB</text>
  <line x1="598" y1="270" x2="636" y2="270" stroke="#16110D" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 652 240 q -14 30 0 60" fill="none" stroke="#C9821A" stroke-width="3.5"/>
  <path d="M 726 240 q 14 30 0 60" fill="none" stroke="#C9821A" stroke-width="3.5"/>
  <circle cx="672" cy="258" r="7" fill="#FFBE2E" stroke="#16110D" stroke-width="2"/>
  <circle cx="700" cy="272" r="7" fill="#FFBE2E" stroke="#16110D" stroke-width="2"/>
  <circle cx="676" cy="290" r="7" fill="#FFBE2E" stroke="#16110D" stroke-width="2"/>
  <rect x="464" y="316" width="150 " height="24" rx="12" fill="#16110D"/>
  <text x="539" y="332" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#FFEECC">THE UNPACKING</text>

  <!-- arrow 2 -->
  <line x1="784" y1="225" x2="820" y2="225" stroke="#16110D" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- card 3: d3-geo -->
  <g filter="url(#softShadow)">
    <rect x="832" y="100" width="330" height="250" rx="16" fill="#FFFCF4" stroke="#16110D" stroke-width="2.5"/>
  </g>
  <text x="856" y="152" font-family="Archivo, Arial, sans-serif" font-size="40" font-weight="900" fill="#FFBE2E" stroke="#16110D" stroke-width="1.2">03</text>
  <text x="916" y="150" font-family="Archivo, Arial, sans-serif" font-size="21" font-weight="900" fill="#16110D">d3-geo</text>
  <text x="856" y="184" font-family="Archivo, Arial, sans-serif" font-size="14.5" fill="#4a4231">Flattens the sphere onto the</text>
  <text x="856" y="204" font-family="Archivo, Arial, sans-serif" font-size="14.5" fill="#4a4231">screen. The projection is the camera.</text>
  <circle cx="906" cy="278" r="42" fill="#FFEECC" stroke="#16110D" stroke-width="2.5"/>
  <ellipse cx="906" cy="278" rx="18" ry="42" fill="none" stroke="#16110D" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="864" y1="278" x2="948" y2="278" stroke="#16110D" stroke-width="1.5" stroke-opacity="0.55"/>
  <line x1="962" y1="278" x2="996" y2="278" stroke="#16110D" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1008" y="240" width="126" height="76" rx="8" fill="#FFBE2E" fill-opacity="0.45" stroke="#16110D" stroke-width="2.5"/>
  <line x1="1008" y1="266" x2="1134" y2="266" stroke="#16110D" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1008" y1="292" x2="1134" y2="292" stroke="#16110D" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1050" y1="240" x2="1050" y2="316" stroke="#16110D" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="1092" y1="240" x2="1092" y2="316" stroke="#16110D" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="856" y="316" width="150" height="24" rx="12" fill="#16110D"/>
  <text x="931" y="332" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#FFEECC">THE PROJECTION</text>

  <!-- bottom line -->
  <rect x="264" y="396" width="672" height="42" rx="21" fill="#16110D" filter="url(#cardShadow)"/>
  <text x="600" y="423" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFEECC">Animate the projection's zoom + centre&#160;&#160;=&#160;&#160;<tspan fill="#FFBE2E">that's your camera move</tspan></text>
</svg>
